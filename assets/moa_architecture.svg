<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1200" viewBox="0 0 2200 1200">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f7f9fc"/></linearGradient>
  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#193b70"/><stop offset="1" stop-color="#315e91"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5f9ff"/><stop offset="1" stop-color="#e7f0ff"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5fbf5"/><stop offset="1" stop-color="#e8f5e8"/></linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f1ff"/><stop offset="1" stop-color="#ebe2ff"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#18324f" flood-opacity=".12"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#334155"/></marker>
  <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#2766bd"/></marker>
  <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#25834a"/></marker>
  <style>
    .title{font:700 42px 'DejaVu Sans',sans-serif;fill:#fff;letter-spacing:.2px}
    .sub{font:400 19px 'DejaVu Sans',sans-serif;fill:#e7eef8}
    .panelTitle{font:700 27px 'DejaVu Sans',sans-serif}
    .head{font:700 21px 'DejaVu Sans',sans-serif;fill:#172b45}
    .body{font:500 18px 'DejaVu Sans',sans-serif;fill:#1e293b}
    .small{font:500 16px 'DejaVu Sans',sans-serif;fill:#334155}
    .tiny{font:500 14px 'DejaVu Sans',sans-serif;fill:#475569}
    .math{font:italic 22px 'DejaVu Serif',serif;fill:#172b45}
    .mathSmall{font:italic 18px 'DejaVu Serif',serif;fill:#172b45}
    .line{fill:none;stroke:#334155;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .lineBlue{fill:none;stroke:#2766bd;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
    .lineGreen{fill:none;stroke:#25834a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
    .dashBlue{fill:none;stroke:#2766bd;stroke-width:2.8;stroke-dasharray:10 8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowBlue)}
    .dashGreen{fill:none;stroke:#25834a;stroke-width:2.8;stroke-dasharray:10 8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowGreen)}
  </style>
</defs>
<rect width="2200" height="1200" fill="url(#bg)"/>
<!-- Title -->
<rect x="510" y="28" width="1180" height="88" rx="22" fill="url(#title)" filter="url(#shadow)"/>
<text x="1100" y="68" text-anchor="middle" class="title">Mixture of Active Experts (MoA)</text>
<text x="1100" y="96" text-anchor="middle" class="sub">Two-stage token-wise routing with independently selected expert projections</text>

<!-- Stage panels -->
<rect x="150" y="155" width="930" height="650" rx="28" fill="#f4f8ff" stroke="#4c8be0" stroke-width="2.5" stroke-dasharray="12 8"/>
<rect x="1110" y="155" width="940" height="650" rx="28" fill="#f4faf4" stroke="#52a76a" stroke-width="2.5" stroke-dasharray="12 8"/>
<rect x="195" y="134" width="470" height="54" rx="16" fill="#2e6fbd"/>
<text x="430" y="170" text-anchor="middle" class="panelTitle" fill="#ffffff">Stage 1 · Up Projection Routing</text>
<rect x="1155" y="134" width="520" height="54" rx="16" fill="#318452"/>
<text x="1415" y="170" text-anchor="middle" class="panelTitle" fill="#ffffff">Stage 2 · Down Projection Routing</text>

<!-- Input -->
<rect x="28" y="445" width="112" height="116" rx="18" fill="url(#blue)" stroke="#315a9b" stroke-width="2.5" filter="url(#shadow)"/>
<text x="84" y="493" text-anchor="middle" class="math">X</text>
<text x="84" y="527" text-anchor="middle" class="mathSmall">(N, D)</text>

<!-- Stage 1 router -->
<rect x="205" y="245" width="160" height="100" rx="16" fill="url(#blue)" stroke="#3476c5" stroke-width="2.5"/>
<text x="285" y="281" text-anchor="middle" class="head">Up Router</text>
<text x="285" y="309" text-anchor="middle" class="small">gate: Linear</text>
<text x="285" y="332" text-anchor="middle" class="mathSmall">D → E</text>
<rect x="410" y="245" width="150" height="100" rx="16" fill="url(#blue)" stroke="#3476c5" stroke-width="2.5"/>
<text x="485" y="286" text-anchor="middle" class="head">Softmax</text>
<text x="485" y="316" text-anchor="middle" class="small">up_scores</text>
<rect x="605" y="245" width="170" height="100" rx="16" fill="url(#blue)" stroke="#3476c5" stroke-width="2.5"/>
<text x="690" y="282" text-anchor="middle" class="head">Top-k Route</text>
<text x="690" y="313" text-anchor="middle" class="small">select + renormalize</text>
<text x="690" y="336" text-anchor="middle" class="mathSmall">(wᵘᵖ, iᵘᵖ)</text>

<!-- Stage 1 expert bank -->
<rect x="250" y="440" width="495" height="285" rx="20" fill="#ffffff" stroke="#7ba7dd" stroke-width="2.2"/>
<text x="497" y="475" text-anchor="middle" class="head">Up halves of experts  e = 1 … E</text>
<rect x="275" y="495" width="445" height="185" rx="15" fill="#f5f9ff" stroke="#9cbce4" stroke-width="1.8"/>
<text x="497" y="526" text-anchor="middle" class="body">For each selected expert e:</text>
<rect x="300" y="548" width="166" height="53" rx="11" fill="#e5efff" stroke="#6b9cda" stroke-width="1.8"/>
<text x="383" y="581" text-anchor="middle" class="small">Wᵉ_gate_up</text>
<text x="383" y="622" text-anchor="middle" class="tiny">Linear: D → 2H</text>
<path d="M468 574 H500" class="lineBlue"/>
<rect x="510" y="548" width="185" height="53" rx="11" fill="#fff0df" stroke="#e6a14b" stroke-width="1.8"/>
<text x="602" y="581" text-anchor="middle" class="small">Split [gate, value]</text>
<path d="M602 604 V631" class="line"/>
<text x="602" y="655" text-anchor="middle" class="body">SiLU(gate) ⊙ value</text>
<text x="497" y="704" text-anchor="middle" class="tiny">SwiGLU activation → hidden vector (H)</text>

<!-- Stage 1 flow -->
<path d="M140 503 H175 V295 H205" class="line"/>
<path d="M365 295 H410" class="lineBlue"/>
<path d="M560 295 H605" class="lineBlue"/>
<path d="M690 345 V397 H497 V440" class="dashBlue"/>
<text x="711" y="394" class="tiny" fill="#2766bd">selected experts + weights</text>
<!-- X input to up experts -->
<path d="M140 520 H185 V765 H230 V625 H250" class="line"/>
<text x="156" y="789" class="tiny">X is the expert input</text>

<!-- Stage 1 aggregation -->
<rect x="795" y="490" width="150" height="120" rx="18" fill="#e6f0ff" stroke="#3476c5" stroke-width="2.5" filter="url(#shadow)"/>
<text x="870" y="529" text-anchor="middle" class="head">Weighted</text>
<text x="870" y="556" text-anchor="middle" class="head">Sum</text>
<text x="870" y="590" text-anchor="middle" class="math">h</text>
<path d="M745 580 H795" class="lineBlue"/>
<text x="768" y="562" class="tiny" text-anchor="middle">wᵘᵖ</text>
<rect x="965" y="490" width="95" height="120" rx="18" fill="#dbeafe" stroke="#3476c5" stroke-width="2.5"/>
<text x="1012" y="540" text-anchor="middle" class="math">h</text>
<text x="1012" y="574" text-anchor="middle" class="mathSmall">(N, H)</text>
<path d="M945 550 H965" class="lineBlue"/>

<!-- Stage 2 router -->
<rect x="1170" y="245" width="160" height="100" rx="16" fill="url(#green)" stroke="#39925a" stroke-width="2.5"/>
<text x="1250" y="281" text-anchor="middle" class="head">Down Router</text>
<text x="1250" y="309" text-anchor="middle" class="small">down_gate: Linear</text>
<text x="1250" y="332" text-anchor="middle" class="mathSmall">H → E</text>
<circle cx="1400" cy="295" r="30" fill="#ffffff" stroke="#39925a" stroke-width="2.5"/>
<text x="1400" y="305" text-anchor="middle" font="700 34px DejaVu Sans" fill="#246b42">+</text>
<rect x="1460" y="245" width="145" height="100" rx="16" fill="url(#green)" stroke="#39925a" stroke-width="2.5"/>
<text x="1532" y="286" text-anchor="middle" class="head">Softmax</text>
<text x="1532" y="316" text-anchor="middle" class="small">down_scores</text>
<rect x="1635" y="245" width="165" height="100" rx="16" fill="url(#green)" stroke="#39925a" stroke-width="2.5"/>
<text x="1717" y="282" text-anchor="middle" class="head">Top-k Route</text>
<text x="1717" y="313" text-anchor="middle" class="small">select + renormalize</text>
<text x="1717" y="336" text-anchor="middle" class="mathSmall">(wᵈⁿ, iᵈⁿ)</text>

<!-- h to down gate and down experts -->
<path d="M1060 550 H1135 V295 H1170" class="lineGreen"/>
<path d="M1060 550 H1135 V635 H1180" class="lineGreen"/>
<text x="1081" y="575" class="tiny" fill="#25834a">h feeds both</text>

<!-- residual up logits to adder -->
<path d="M285 245 V210 H1400 V265" class="dashBlue"/>
<text x="900" y="198" text-anchor="middle" class="small" fill="#2766bd">up_logits (pre-softmax) · residual connection</text>
<path d="M1330 295 H1370" class="lineGreen"/>
<path d="M1430 295 H1460" class="lineGreen"/>
<path d="M1605 295 H1635" class="lineGreen"/>

<!-- Stage 2 expert bank -->
<rect x="1180" y="440" width="520" height="285" rx="20" fill="#ffffff" stroke="#79b78a" stroke-width="2.2"/>
<text x="1440" y="475" text-anchor="middle" class="head">Down projections of experts  e = 1 … E</text>
<rect x="1210" y="510" width="460" height="150" rx="15" fill="#f5fbf5" stroke="#a3c9ad" stroke-width="1.8"/>
<text x="1440" y="545" text-anchor="middle" class="body">For each selected expert e:</text>
<rect x="1255" y="570" width="365" height="58" rx="12" fill="#e5f5e8" stroke="#66ad78" stroke-width="2"/>
<text x="1437" y="594" text-anchor="middle" class="head">Wᵉ_down</text>
<text x="1437" y="617" text-anchor="middle" class="small">Linear: H → D</text>
<text x="1440" y="690" text-anchor="middle" class="tiny">No activation in the down projection</text>
<!-- route control into stage2 experts -->
<path d="M1717 345 V395 H1440 V440" class="dashGreen"/>
<text x="1610" y="388" class="tiny" fill="#25834a">selected experts + weights</text>

<!-- Stage 2 aggregation/output -->
<rect x="1740" y="490" width="145" height="120" rx="18" fill="#e7f6e9" stroke="#39925a" stroke-width="2.5" filter="url(#shadow)"/>
<text x="1812" y="529" text-anchor="middle" class="head">Weighted</text>
<text x="1812" y="556" text-anchor="middle" class="head">Sum</text>
<text x="1812" y="590" text-anchor="middle" class="math">Δ</text>
<path d="M1700 580 H1740" class="lineGreen"/>
<text x="1720" y="562" class="tiny" text-anchor="middle">wᵈⁿ</text>
<rect x="1905" y="490" width="125" height="120" rx="18" fill="#e1f3e5" stroke="#39925a" stroke-width="2.5"/>
<text x="1967" y="540" text-anchor="middle" class="math">Δ</text>
<text x="1967" y="574" text-anchor="middle" class="mathSmall">(N, D)</text>
<path d="M1885 550 H1905" class="lineGreen"/>
<path d="M2030 550 H2070" class="line"/>
<text x="2090" y="532" text-anchor="middle" class="small">Primary</text>
<text x="2090" y="558" text-anchor="middle" class="small">output</text>

<!-- Router balance loss paths -->
<rect x="305" y="870" width="390" height="90" rx="18" fill="#eef5ff" stroke="#6e9fe0" stroke-width="2.2"/>
<text x="500" y="906" text-anchor="middle" class="head">Up-router balance loss</text>
<text x="500" y="938" text-anchor="middle" class="mathSmall">L_up(up_scores, up_i)</text>
<path d="M485 345 V825 H500 V870" class="dashBlue"/>
<rect x="1350" y="870" width="420" height="90" rx="18" fill="#eff8f0" stroke="#68ad7a" stroke-width="2.2"/>
<text x="1560" y="906" text-anchor="middle" class="head">Down-router balance loss</text>
<text x="1560" y="938" text-anchor="middle" class="mathSmall">L_down(down_scores, down_i)</text>
<path d="M1532 345 V825 H1560 V870" class="dashGreen"/>
<rect x="820" y="1000" width="560" height="112" rx="20" fill="url(#purple)" stroke="#8054b8" stroke-width="2.5" filter="url(#shadow)"/>
<text x="1100" y="1042" text-anchor="middle" class="head">Auxiliary Load-Balancing Loss</text>
<text x="1100" y="1084" text-anchor="middle" class="math">L_aux = 0.5 · (L_up + L_down)</text>
<path d="M500 960 V982 H940 V1000" class="dashBlue"/>
<path d="M1560 960 V982 H1260 V1000" class="dashGreen"/>

<!-- Initialization note -->
<rect x="1420" y="1000" width="660" height="112" rx="18" fill="#fffaf0" stroke="#d6a44a" stroke-width="2"/>
<text x="1450" y="1037" class="head" fill="#80591c">Initialization behavior</text>
<text x="1450" y="1068" class="small">down_gate is zero-initialized ⇒ down_logits = up_logits</text>
<text x="1450" y="1095" class="small">Initial assignments match; training learns to diverge.</text>

<!-- Footer legend -->
<text x="42" y="1160" class="tiny">E = n_experts · k = top_k · H = moe_hidden · D = d_model · N = number of tokens</text>
<text x="42" y="1185" class="tiny">Each expert e has an Up half and a Down half; the two stages route these halves independently.</text>
<text x="42" y="1198" class="tiny">forward() returns (Δ, L_aux).</text>
</svg>
